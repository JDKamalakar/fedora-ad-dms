# ==============================================================================
# AD-DMS Hardware & Device Policy Rules
# This configuration is synchronized from the central Git repository and
# enforced periodically across all managed workstations.
# ==============================================================================

# Lock system display brightness to 100% (yes / no)
LOCK_BRIGHTNESS_100="yes"

# Lock system audio / master volume to 100% (yes / no)
LOCK_VOLUME_100="yes"

# Re-enforcement check interval in minutes (defaults to 5 minutes)
DEVICE_CHECK_INTERVAL="5m"
